xln:
  etcd-config:
    endPoint:
      name: etcd
    configNamespace: "local"
    enableVersionMeter: false
  cluster-config:
    port: 0
  dtask-config:
    root: xln-dtask-coordinator-test
    claimTtl: 10
    resyncInterval: 60000
    dScheduler:
      enable: true
      configs:
        - serviceGroup: "coordinator-test-group"
          serviceName: "coordinator-test-service"

xln.service-config:
  resourcePath: []
