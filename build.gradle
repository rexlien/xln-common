


plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot'
    id "com.google.protobuf"
    id "org.jetbrains.kotlin.jvm"
}


group 'xln'
version '1.0'



sourceCompatibility = 1.11
targetCompatibility = 1.11


apply from : "buildSrc/common-gradle/common.gradle"

apply from : "buildSrc/common-gradle/boot.gradle"
apply from : "buildSrc/common-gradle/jar.gradle"
apply from : "buildSrc/common-gradle/deps.gradle"
apply from : "buildSrc/common-gradle/web.gradle"


sourceSets {
    main {
        proto {
            srcDir 'src/main/xln-proto'
        }
    }
}
dependencies {

    testImplementation "org.testcontainers:kafka:1.17.6"
    testImplementation "com.squareup.okhttp3:mockwebserver:3.14.9"

}

test {
    jvmArgs '-Dio.netty.resolver.dns.macos.disable=true'
    jvmArgs '-Xmx1g'
    maxParallelForks = 1
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}

project.xlnCompileOnly(libs.sparkSet)

